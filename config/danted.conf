logoutput: /var/log/socks.log
errorlog: /var/log/socks.error.log

socksmethod: pam.username

user.privileged: root
user.unprivileged: nobody
user.libwrap: nobody

internal: eth0 port=1080
external: eth0

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
}

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
}
